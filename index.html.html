<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Có người muốn rủ em đi chơi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fde4e8; --card:#fffafa; --ink:#4a1d33; --muted:#8a5a6e;
  --berry:#c2185b; --berry-d:#9c1049; --line:#e9b8c6; --no-bg:#f3e3e8;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a1020; --card:#3a1a2c; --ink:#ffe9ef; --muted:#d9a8bb;
    --berry:#ff6f9f; --berry-d:#ff8fb3; --line:#6b3550; --no-bg:#4b2639;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a1020; --card:#3a1a2c; --ink:#ffe9ef; --muted:#d9a8bb;
  --berry:#ff6f9f; --berry-d:#ff8fb3; --line:#6b3550; --no-bg:#4b2639;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:20px; overflow:hidden;
}
.ticket{
  position:relative; width:min(420px,100%);
  background:var(--card); border-radius:20px;
  padding:36px 28px 30px; text-align:center;
  box-shadow:0 18px 40px rgba(120,20,60,.18);
}
/* khuyết hai bên như vé */
.ticket::before,.ticket::after{
  content:""; position:absolute; top:58%; width:26px; height:26px;
  background:var(--bg); border-radius:50%;
}
.ticket::before{left:-13px} .ticket::after{right:-13px}
.perf{
  border:0; border-top:2px dashed var(--line);
  margin:26px 6px 24px;
}
.emoji{font-size:54px; line-height:1; display:inline-block; animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
h1{
  font-family:Pacifico,cursive; font-weight:400;
  font-size:2rem; line-height:1.3; margin:14px 0 8px; color:var(--berry);
}
.sub{margin:0; color:var(--muted); line-height:1.6; font-size:1rem}
.q{font-weight:700; font-size:1.2rem; margin:0 0 20px; line-height:1.4}
.btns{display:flex; gap:14px; justify-content:center; align-items:center; min-height:56px}
button{
  font:inherit; font-weight:700; border:0; border-radius:999px; cursor:pointer;
  padding:14px 28px; font-size:1.05rem; touch-action:manipulation;
  transition:transform .15s ease, background .15s ease;
}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
#yes{background:var(--berry); color:#fff; transform-origin:center}
#yes:hover{background:var(--berry-d)}
#no{background:var(--no-bg); color:var(--ink)}
#no.run{position:fixed; z-index:10; transition:left .25s ease, top .25s ease}
.hint{min-height:1.5em; margin:18px 0 0; color:var(--muted); font-size:.92rem}
.done{display:none}
.done h1{font-size:2.2rem}
.is-done .ask{display:none}
.is-done .done{display:block}
.heart{position:fixed; top:-40px; pointer-events:none; z-index:20; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg); opacity:.9}}
@media (prefers-reduced-motion: reduce){
  .emoji{animation:none}
  #no.run{transition:none}
}
</style>
</head>
<body>
<main class="ticket" id="ticket">
  <div class="ask">
    <div class="emoji" aria-hidden="true">💌</div>
    <h1>Quỳnh Anh ơi</h1>
    <p class="sub">Khi nào xong nhắn cho anh đó nhaaa.</p>
    <hr class="perf">
    <p class="q">Hôm nay mình đi chơi  tới sáng nhớ?</p>
    <div class="btns" id="btns">
      <button id="yes" type="button">Em đồng ý 💕</button>
      <button id="no" type="button">Không</button>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>

  <div class="done">
    <div class="emoji" aria-hidden="true">🥰</div>
    <h1>Yeah, Chốt!</h1>
    <p class="sub">Không ngờ là em đồng ý luôn. Giờ nhắn cho anh biết em muốn đi đâu, ăn gì, rồi mình đi nha.</p>
    <hr class="perf">
    <p class="q">Vé đã được xác nhận 🎟️<br></p>
  </div>
</main>

<script>
(function(){
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var hint = document.getElementById('hint');
  var ticket = document.getElementById('ticket');
  var tries = 0;
  var scale = 1;
  var lines = [
    "Ơ kìa, bấm nhầm rồi nè 🙈",
    "Nút này hơi ngại, nó trốn rồi 😆",
    "Em thử lại xem, lần này chắc được?",
    "Anh biết em đang đùa mà 🥺",
    "Thôi mà, nút Đồng ý to thế kia kìa",
    "Nút Không bị lỗi rồi, em bấm Đồng ý đi 😘",
    "Em mà bấm trúng thì anh... buồn đó 😢"
  ];

  function dodge(e){
    if (e && e.preventDefault) e.preventDefault();
    var pad = 12;
    var w = no.offsetWidth, h = no.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var x, y, guard = 0, yr = yes.getBoundingClientRect();
    // chọn chỗ mới, tránh đè lên nút Đồng ý
    do {
      x = pad + Math.random() * Math.max(1, vw - w - pad * 2);
      y = pad + Math.random() * Math.max(1, vh - h - pad * 2);
      guard++;
    } while (guard < 30 &&
      x < yr.right + 10 && x + w > yr.left - 10 &&
      y < yr.bottom + 10 && y + h > yr.top - 10);

    no.classList.add('run');
    no.style.left = x + 'px';
    no.style.top = y + 'px';

    hint.textContent = lines[Math.min(tries, lines.length - 1)];
    tries++;
    scale = Math.min(scale + 0.12, 1.9);
    yes.style.transform = 'scale(' + scale + ')';
  }

  no.addEventListener('mouseenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('touchstart', dodge, {passive:false});
  no.addEventListener('click', dodge);
  no.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') dodge(e);
  });

  function rain(){
    var icons = ['💖','💕','💗','🌸','💘','✨'];
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var n = reduce ? 12 : 55;
    for (var i = 0; i < n; i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement('span');
          s.className = 'heart';
          s.textContent = icons[Math.floor(Math.random() * icons.length)];
          s.style.left = Math.random() * 100 + 'vw';
          s.style.fontSize = (18 + Math.random() * 26) + 'px';
          s.style.animationDuration = (2.6 + Math.random() * 2.6) + 's';
          document.body.appendChild(s);
          setTimeout(function(){ s.remove(); }, 6000);
        }, i * 70);
      })(i);
    }
  }

  yes.addEventListener('click', function(){
    no.style.display = 'none';
    ticket.classList.add('is-done');
    rain();
  });
})();
</script>
</body>
</html>
